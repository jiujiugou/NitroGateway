# NitroGateway — 现场边缘网关（Linux）一体机（采集 + 本地库 + web 管理端装在一台机器）
# 启动: docker compose up -d
# 停止: docker compose down
# 查看: http://localhost:5170
#
# ADR-054：web 收敛为纯边缘单一身份（Linux 网关管理端）——本栈 = mqtt + gateway（边缘：采集/转发/MQTT 发布/告警评估恒注册）+ web（Vue 管理面板）。
# 边缘网关数据流：本机采集 → 本地 SQLite → MQTT 发布到 broker，谁订阅谁消费（不依赖中心/Ingest）。
# 中心（如需多现场）待独立建项目；docker-compose.center.yml 归档暂不删，见 README「部署形态」。

services:
  # ── MQTT Broker（现场上行汇聚，供任意订阅端消费）──
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── 后端 API（边缘网关）──
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5100:5100"
    # Modbus RTU 串口透传：按实际设备路径挂载（Linux 主机）
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    #   - "/dev/ttyS0:/dev/ttyS0"
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/nitrogateway.db
      # ADR-022 P1-5：JWT 密钥必填，未设置直接拒绝启动（不再回退公开占位符，防伪造 Admin）
      - Security__JwtSecretKey=${JWT_SECRET:?JWT_SECRET 环境变量必须设置（生产强密钥，禁止使用仓库内占位符）}
      # ADR-052 问题1：单现场网关转发需连到 broker 容器（appsettings 默认 MQTT:Host=localhost 指向自身，会断链）
      - MQTT__Host=mqtt
      - MQTT__Port=1883
      # ADR-052 问题2：生产强制覆盖内置测试账号 admin 密码，未设置直接拒绝启动
      - Security__Users__0__Password=${ADMIN_PASSWORD:?ADMIN_PASSWORD 环境变量必须设置（生产禁用默认测试账号 admin/admin123）}
    depends_on:
      - mqtt
    restart: unless-stopped

  # ── 前端（nginx 代理到 gateway:5100）──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5170:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  gateway-data:
  gateway-logs: