# NitroGateway — 一键部署
# 启动: docker compose up -d
# 停止: docker compose down
# 查看: http://localhost:5170

services:
  # ── MQTT Broker ──
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── 后端 API ──
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5100:5100"
    # Modbus RTU 串口透传：按实际设备路径挂载（Linux 主机）
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    #   - "/dev/ttyS0:/dev/ttyS0"
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/nitrogateway.db
      # ADR-022 P1-5：JWT 密钥必填，未设置直接拒绝启动（不再回退公开占位符，防伪造 Admin）
      - Security__JwtSecretKey=${JWT_SECRET:?JWT_SECRET 环境变量必须设置（生产强密钥，禁止使用仓库内占位符）}
    depends_on:
      - mqtt
    restart: unless-stopped

  # ── 中心 Ingest（ADR-025 D1：独立容器，订阅现场上行入库）──
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: src/NitroGateway.Ingest/NitroGateway.Ingest.csproj
    entrypoint: ["dotnet", "NitroGateway.Ingest.dll"]
    ports:
      - "5200:5200"
    volumes:
      - center-data:/app/data
      - center-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/center.db
      - MQTT__Host=mqtt
      - MQTT__Port=1883
      - ASPNETCORE_URLS=http://0.0.0.0:5200
    depends_on:
      - mqtt
    restart: unless-stopped


  # ── 前端 ──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5170:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  gateway-data:
  gateway-logs:
  center-data:
  center-logs:
