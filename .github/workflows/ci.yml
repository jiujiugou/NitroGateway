# NitroGateway CI/CD（ADR-028 P1-1 + ADR-058）
# 验证（CI）：validate-compose + build-server（ubuntu 服务器端）+ build-windows（全量含 WPF Desktop）
# 交付（CD）：build-images 在 push master / v* tag 且测试全绿后，构建 gateway/web 镜像推送到 GHCR
#             （ghcr.io/jiujiugou/nitrogateway-gateway / -web：latest + sha-<7> + vX.Y.Z）
name: CI/CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  # 语法校验 compose 各形态（缺必填环境变量时用 CI 占位值，仅校验不运行）
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        env:
          JWT_SECRET: ci-validate-only-0123456789abcdef
          ADMIN_PASSWORD: ci-validate-only
          OPERATOR_PASSWORD: ci-validate-only
          VIEWER_PASSWORD: ci-validate-only
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.cd.yml config -q
          docker compose -f docker-compose.center.yml config -q
          docker compose -f docker-compose.monitoring.yml config -q

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/NitroGateway.Webapi/NitroGateway.Webapi.csproj
          dotnet restore src/NitroGateway.Ingest/NitroGateway.Ingest.csproj

      - name: Build
        run: |
          dotnet build src/NitroGateway.Webapi/NitroGateway.Webapi.csproj --no-restore --configuration Release
          dotnet build src/NitroGateway.Ingest/NitroGateway.Ingest.csproj --no-restore --configuration Release
          dotnet build tests/NitroGateway.IntegrationTests/NitroGateway.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/NitroGateway.IntegrationTests/NitroGateway.IntegrationTests.csproj --no-build --configuration Release

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NitroGateway.slnx

      - name: Build
        run: dotnet build NitroGateway.slnx --no-restore --configuration Release

      - name: Test
        # 顺序跑两个测试项目，避免跨进程并行（UnitTests 为 WPF TFM，与 IntegrationTests 并行曾复现 ForwarderEngineTests 停机排空 flaky，ADR-028 P1-1）
        run: |
          dotnet test tests/NitroGateway.UnitTests/NitroGateway.UnitTests.csproj --no-build --configuration Release
          dotnet test tests/NitroGateway.IntegrationTests/NitroGateway.IntegrationTests.csproj --no-build --configuration Release

  # —— CD：构建并推送 Docker 镜像到 GHCR（仅 push master / v* tag，且前置 job 全绿）——
  build-images:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [ validate-compose, build-server, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/jiujiugou/nitrogateway-gateway:${{ steps.version.outputs.version }}
            ghcr.io/jiujiugou/nitrogateway-gateway:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/jiujiugou/nitrogateway-web:${{ steps.version.outputs.version }}
            ghcr.io/jiujiugou/nitrogateway-web:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
