name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NitroGateway.slnx

      - name: Build
        run: dotnet build NitroGateway.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test NitroGateway.slnx --no-build --configuration Release