# NitroGateway — 中心形态（B 方案：多现场 → 一中心）
# 启动: docker compose -f docker-compose.center.yml up -d --build
# 停止: docker compose -f docker-compose.center.yml down
# 查看: 中心 Web http://localhost:5170 | 中心 API http://localhost:5100/swagger | 中心指标 http://localhost:5200/metrics
#
# 与 docker-compose.yml（单现场一体机演示）使用同一套宿主端口，正常运行二选一；
# 需同时跑两个栈时用 -p 区分项目并覆盖端口，示例见 README「部署形态」。
#
# 数据流: 现场（桌面端/边缘网关）→ MQTT broker → ingest 订阅写中心库 center.db
#         → 中心 Webapi 读 center.db → Vue 展示。中心库唯一写点是 ingest。

services:
  # ── MQTT Broker（现场上行汇聚）──
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── 中心入库（ADR-025 D1：独立容器；订阅 nitrogateway/+/measurements 与 +/alarms）──
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: src/NitroGateway.Ingest/NitroGateway.Ingest.csproj
    entrypoint: ["dotnet", "NitroGateway.Ingest.dll"]
    ports:
      - "5200:5200"
    volumes:
      - center-data:/app/data
      - center-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/center.db
      - MQTT__Host=mqtt
      - MQTT__Port=1883
      - ASPNETCORE_URLS=http://0.0.0.0:5200
    depends_on:
      - mqtt
    restart: unless-stopped

  # ── 中心 API + 展示后端（读中心库 center.db；Deployment:Mode=Center 不跑采集/转发，中心库唯一写点是 ingest）──
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5100:5100"
    volumes:
      - center-data:/app/data
      - center-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/center.db
      # ADR-035 第 0 步：平台中心形态——不注册采集/转发/MQTT 发布，避免中心重复采集/双写 center.db
      - Deployment__Mode=Center
      # ADR-022 P1-5：JWT 密钥必填，未设置直接拒绝启动（与单现场形态一致）
      - Security__JwtSecretKey=${JWT_SECRET:?JWT_SECRET 环境变量必须设置（生产强密钥，禁止使用仓库内占位符）}
    depends_on:
      - ingest
    restart: unless-stopped

  # ── 前端（nginx 代理到 gateway:5100，与单现场形态同一镜像）──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5170:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  center-data:
  center-logs:
