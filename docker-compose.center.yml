# NitroGateway — 中心形态（B 方案）【归档暂不删 · ADR-054】
# ⚠ 本文件仅存档参考：ADR-054 已把 web 收敛为纯边缘单一身份，webapi 的 Center 模式（Deployment:Mode）已从代码移除。
#   若按本文件启动，gateway 会以边缘形态读取 center.db（并非原「中心只读不采」语义），不建议使用。
#   中心（如需多现场）待独立建项目（中心 webapi + Ingest），不复用 webapi 双模式。
# 原始用途（ADR-025/035）：多现场 → 一中心。数据流: 现场 → MQTT broker → ingest 订阅写 center.db → 中心 Webapi 读 center.db → Vue。
# 启动/停止（仅存档，不再维护）: docker compose -f docker-compose.center.yml up -d --build / down

services:
  # ── MQTT Broker（现场上行汇聚）──
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── 中心入库（ADR-025 D1：独立容器；订阅 nitrogateway/+/measurements 与 +/alarms）──
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: src/NitroGateway.Ingest/NitroGateway.Ingest.csproj
    entrypoint: ["dotnet", "NitroGateway.Ingest.dll"]
    ports:
      - "5200:5200"
    volumes:
      - center-data:/app/data
      - center-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/center.db
      - MQTT__Host=mqtt
      - MQTT__Port=1883
      - ASPNETCORE_URLS=http://0.0.0.0:5200
    depends_on:
      - mqtt
    restart: unless-stopped

  # ── 中心 API + 展示后端（读中心库 center.db；存档参考：ADR-054 已移除 Center 模式，此形态不再可用）──
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5100:5100"
    volumes:
      - center-data:/app/data
      - center-logs:/app/logs
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Persistence__ConnectionString=Data Source=/app/data/center.db
      # ADR-022 P1-5：JWT 密钥必填，未设置直接拒绝启动（与单现场形态一致）
      - Security__JwtSecretKey=${JWT_SECRET:?JWT_SECRET 环境变量必须设置（生产强密钥，禁止使用仓库内占位符）}
      # ADR-052 问题2：生产强制覆盖内置测试账号 admin 密码，未设置直接拒绝启动（与单现场形态一致）
      - Security__Users__0__Password=${ADMIN_PASSWORD:?ADMIN_PASSWORD 环境变量必须设置（生产禁用默认测试账号 admin/admin123）}
    depends_on:
      - ingest
    restart: unless-stopped

  # ── 前端（nginx 代理到 gateway:5100，与单现场形态同一镜像）──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5170:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  center-data:
  center-logs: